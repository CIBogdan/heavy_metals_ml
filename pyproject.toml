[project]
name = "heavymetals"
version = "0.1.0"
description = "End-to-end ML + ANN pipelines for heavy-metal risk classification and concentration regression."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bogdan Cioroiu"}]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "joblib>=1.3",
  "pyyaml>=6.0",
  "tensorflow>=2.14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "black>=24.0",
  "mypy>=1.8",
  "pre-commit>=3.6",
]

[project.scripts]
heavymetals-train-cls = "heavymetals.cli.train_classification:main"
heavymetals-train-reg = "heavymetals.cli.train_regression:main"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
